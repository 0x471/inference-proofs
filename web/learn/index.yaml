# The Learn pages (the hub at /learn): the tracks and their pages in reading order, then the
# glossary. Each page's text lives in <slug>.md next to this file, in the Markdown subset that
# web/draw/learn.py parses. A slug is the page's address on the site.
title: Learn
lead: >-
  Suppose an AI provider sends back a reply to your prompt. A proof of inference lets anyone
  check, without seeing the model's weights, that the reply really came from a model committed
  in advance.
tracks:
  - id: policy
    name: For policy readers
    reader: No cryptography background needed.
    pages:
      - slug: proof-of-inference
        title: What a proof shows
        summary: >-
          A proof shows that a reply is the committed model's greedy output for a prompt. It does
          not say whose model it is, or prove that the reply was served live.
      - slug: how-a-check-works
        title: How a check works
        summary: >-
          How the benchmark works: one shared request, a commitment, a proof checked without the
          weights, six entry checks, and the cost ratio behind the headline number.
      - slug: deployment
        title: Deployments and treaties
        summary: >-
          Proving a reply costs many times more than serving it, yet checking the proof requires
          no weights and no trusted chip. Under an agreement, an operator could prove replies
          sampled from a trusted traffic log.
  - id: engineering
    name: For prover teams and engineers
    reader: ""
    pages:
      - slug: method
        title: How we compare
        summary: >-
          Every system runs the same request. Systems that pass all six checks and state a
          security level are ranked by proving cost vs serving within each model rung.
      - slug: statement
        title: The statement
        summary: >-
          The verifiers on the ladder check the greedy reply of a committed, quantized copy of the
          model. So far, no system has a proved error bound that covers the exact setup we run.
      - slug: forward-pass
        title: Proving a forward pass
        summary: >-
          How inference provers work: the verifier tests the prover's committed values at random
          points, and matrix multiplications with the committed weights turn out to be the easy
          part.
glossary:
  slug: glossary
  title: Glossary
  summary: Plain definitions for the terms used on the ladder and in verifiable inference.
# The Autoresearch page (/autoresearch): under its own tab, not listed on the Learn hub
autoresearch:
  slug: autoresearch
  title: Autoresearch
  summary: >-
    Component benchmarks for individual prover building blocks (such as lookup arguments and
    range checks), designed for automated search loops. Not open yet while we finalize the rules.
