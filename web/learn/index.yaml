# The Learn pages (the hub at /learn): the tracks and their pages in reading order, then the
# glossary. Each page's words are in <slug>.md beside this file, in the Markdown subset that
# web/draw/learn.py reads. A slug is the page's address on the site.
title: Learn
lead: >-
  A proof of inference lets anyone check, without the model's weights, that a reply is what a
  model, committed in advance, produces for its prompt.
tracks:
  - id: policy
    name: For policy readers
    reader: No cryptography needed.
    pages:
      - slug: proof-of-inference
        title: What a proof shows
        summary: >-
          A proof shows a reply is the committed model's greedy reply to its prompt, not whose
          model it is or that the reply was served.
      - slug: how-a-check-works
        title: How a check works
        summary: >-
          One request for every system, a commitment, a proof and a verifier without the weights,
          six checks drawn one by one, and the fraction behind the headline figure.
      - slug: deployment
        title: Deployments and treaties
        summary: >-
          Proving costs a large multiple of serving, and checking needs no weights or trusted
          chip. A treaty could prove replies sampled from a trusted record.
  - id: engineering
    name: For prover teams and engineers
    reader: ""
    pages:
      - slug: method
        title: How we compare
        summary: >-
          Every system gets the same request. Those passing the six checks, with a stated
          security level, are ranked by cost vs serving inside one model.
      - slug: statement
        title: The statement
        summary: >-
          The ladder's verifiers check a committed, quantized copy's greedy reply. No row has a
          proved error bound that covers what it runs.
      - slug: forward-pass
        title: Proving a forward pass
        summary: >-
          The verifier tests the prover's committed values at random points. Matrix products with
          the committed weights are the cheap part to prove.
glossary:
  slug: glossary
  title: Glossary
  summary: The ladder's words and the field's.
