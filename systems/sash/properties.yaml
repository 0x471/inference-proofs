      basis:
        value: "conjectured"
        quotes: [{text: "stwo's own conjectured-soundness accounting is", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/src/util.rs#L9"}]
      unit:
        value: "part"
        quotes: [{text: "A proof made by this prover is about one **segment**: one transformer layer", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/docs/statement.md#L3"}]
      batch: {value: "not_said", quotes: []}
      adversary: {value: "not_said", quotes: []}
