# Statement facts of SASH's glyph (RFC-0018 GL-1), copied from sg-ai-safety-hub/zk-inference-prover at the pin
# for the configuration the row runs (claim.yaml, `boundary-grid --verify`). Statements made only in the companion
# results repository are not used (INV-CLAIM-3). No state is typed. Read by the integrator on 2026-11-13; not
# reviewed by SASH's maintainers. First read at eb95bfa; the quoted files read the same at the pin, 4f41667
# (README.md, prover/README.md, docs/statement.md and prover/src/util.rs byte for byte; prover/src/compose.rs at
# L1-L30).
schema: "properties/2"
system: "sash"
configuration: "sound-defaults"
upstream: {repo: "sg-ai-safety-hub/zk-inference-prover", commit: "4f41667297430a598165c4a8604258fe37d952ae"}
read: "2026-11-13"
# The verifier the row runs, as the publisher names it; no verifier is named for the 100 bits, which
# pcs_config asserts (read 2026-11-15).
verifiers:
  run:
    value: "boundary-grid --verify"
    quotes: [{text: "`verify_composed` -- the only accept path, and what `boundary-grid --verify` runs on every chunk", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/README.md#L34-L35"}]
