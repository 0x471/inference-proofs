        value: "not_stated"
        quotes:
          - {text: "A STARK prover for the decode step of a quantized transformer", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/README.md#L3"}
          - {text: "`security` (the FRI parameters and the hash)", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/README.md#L324"}
          - {text: "`Fixed` — produced at setup, trusted by the verifier: the shape and gadget", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/src/compose.rs#L7"}
        note: "the test FlashProve's row meets (GL-10, amended 2026-11-15): a petal is read as transparent only when the publisher states what soundness rests on, as a theorem or a sentence, and none of it is a setup that produced a secret. SASH states no soundness assumption: it names its construction (a STARK, FRI parameters and a hash), which is not a statement of what soundness rests on, and its Fixed statement is produced at setup and trusted by the verifier, with who produces it not stated. So not stated, with these quotes as what was read"
      publicly_checkable:
        value: true
        quotes: [{text: "The **verifier** (`verify_composed`) takes those two byte strings and the //! serialized proof, and nothing else", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/src/compose.rs#L15-L16"}]
