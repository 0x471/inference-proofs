        quotes: [{text: "assert_eq!(cfg.security_bits(), 100, \"security parameter drifted\");", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/src/util.rs#L26"}]
        note: "the security parameters are constants (util.rs L14-L16) and pcs_config() asserts 100 bits (L26); the row runs the sound defaults"
      conditions_shown: {value: false, quotes: []}
      program:
        value: "not_stated"
        quotes: []
        note: "our reading: no sentence states that the verifier the row runs uses pcs_config; the 100 bits are asserted in pcs_config itself (util.rs L26); not read while the basis is conjectured"
