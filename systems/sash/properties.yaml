        value: false
        quotes: [{text: "The model root is not derivable -- it is the publisher's commitment to weights the verifier does not hold", url: "https://github.com/sg-ai-safety-hub/zk-inference-prover/blob/4f41667297430a598165c4a8604258fe37d952ae/prover/README.md#L56-L58"}]
