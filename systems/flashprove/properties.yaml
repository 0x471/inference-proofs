# Statement facts of FlashProve's glyph (RFC-0018 GL-1), copied from the documentation at the pin for the
# configuration the row runs (cp_verify at exact match, claim.yaml). No state is typed: iproofs.glyph computes
# each petal. Read by the integrator on 2026-11-13; not reviewed by FlashProve's maintainers. Values with a
# `note` are the reader's reading, not words of the publisher (RFC-0018 §Conflicts of Interest).
schema: "properties/2"
system: "flashprove"
configuration: "exact-match-cp-verify"
upstream: {repo: "anthropics/FlashProve", commit: "9e2bdd8ff5bf9c62f18263d7dac189b0400b260c"}
read: "2026-11-13"
# RFC-0018 SI-4a, read 2026-11-15: one sentence says what an accept means, the committed model's top choice
# at each checked position; the second says which positions a request checks (the adapter sends the reply's).
level_statement:
  sources_read: ["guide/how-it-works.md"]
  accept_is_model_reply:
    value: true
    quotes:
      - text: "Under exact match, a `YES` [is meant to show](../docs/limits.md#what-a-yes-covers) that each checked token is the committed integer model's top choice at its position"
        url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/how-it-works.md#L57-L58"
      - text: "For a prompt of P tokens and a reply of R, r = P − 1 and e = P + R − 1."
        url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/how-it-works.md#L49"
# The verifier the row runs and the one the bound and the theorem are stated for, as the publisher
# names them (read 2026-11-15): Unforgeable and Machine-checked name both in their reasons.
verifiers:
  run:
    value: "cp_verify"
    described: "the publisher's C++ verifier"
    quotes: [{text: "Anyone can check the proof on an ordinary CPU in seconds with `cp_verify`, without the weights.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L15-L16"}]
  stated:
    value: "the Lean verifier"
    described: "a verifier the publisher wrote in Lean and proves things about"
    quotes:
      - {text: "The Lean verifier accepts a proof of a false claim with probability at most about q/2^124 + 2^-101 after q hash queries (about 124 bits per query; not \"128 bits\")", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L46-L47"}
      - {text: "Neither figure, 124 bits per query or 128 bits per round, is claimed for the C++ programs.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L70"}
# the publisher's name for its soundness notion, printed on the Stated security line (SI-3, amended
# 2026-11-15); it sets no state
notion:
  quotes:
    - {text: "`Sound` is index-binding knowledge soundness, in its witness-free case, as defined in `lean/ZKCP/Defs.lean` (`HasIndexBinding`; the terms: [TERMS.md](TERMS.md)), for a claim (a prompt with an output that is said to be the model's)", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L352-L354"}
    - {text: "This is binding for the language, not knowledge soundness: the theorem does not show that the prover knows the weights or ran the model.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/LIMITS.md#L1155-L1157"}
# The number format of the copy the row proves (RFC-0018 SI-9, amended 2026-11-16), read 2026-11-16 in the
# document that defines Model, the function FlashProve proves; printed beside every Fidelity figure, it sets no state
number_format:
  weights:
    value: "integer"
    quotes: [{text: "Model is Llama 4 Maverick's text transformer in integer arithmetic: integer weights, fixed-point activations with fitted power-of-two scales, and lookup tables for the non-linear functions", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/model.md#L8-L9"}]
  activations:
    value: "fixed_point"
    quotes: [{text: "Model is Llama 4 Maverick's text transformer in integer arithmetic: integer weights, fixed-point activations with fitted power-of-two scales, and lookup tables for the non-linear functions", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/model.md#L8-L9"}]
petals:
  unforgeable:
    sources_read: ["README.md", "guide/what-is-proved.md", "lean/THEOREM.md", "guide/known-limits.md"]
    bound:
      stated:
        value: true
        quotes:
          - text: "The Lean verifier accepts a proof of a false claim with probability at most about q/2^124 + 2^-101 after q hash queries (about 124 bits per query; not \"128 bits\")"
            url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L46-L47"
      expression:
        value: "q/2^124 + 2^-101"
        quotes:
          - text: "The Lean verifier accepts a proof of a false claim with probability at most about q/2^124 + 2^-101 after q hash queries (about 124 bits per query; not \"128 bits\")"
            url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L46-L47"
      terms: [124, 101]
      # what the bound counts (its q), read 2026-11-17; printed with the first term's crossings, it sets no step
      after:
        value: "q hash queries"
        quotes: [{text: "The Lean verifier accepts a proof of a false claim with probability at most about q/2^124 + 2^-101 after q hash queries (about 124 bits per query; not \"128 bits\")", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L46-L47"}]
      basis:
        value: "proved"
        quotes: [{text: "Lean's kernel has checked the proof.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L51"}]
      unit:
        value: "proof"
        quotes:
          - {text: "The bound is for one commitment, one prompt, one output, one proof and one call of `verify`.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L150-L151"}
          - {text: "**One proof.** N proofs handed in at once under one commitment, or N members of a batch, cost N times that error, taken at the whole list's hash queries; for proofs checked one after another, or members checked in separate sessions, no bound is stated.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L66-L68"}
      batch:
        value: "together"
        quotes:
          - {text: "**One proof.** N proofs handed in at once under one commitment, or N members of a batch, cost N times that error, taken at the whole list's hash queries; for proofs checked one after another, or members checked in separate sessions, no bound is stated.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L66-L68"}
          - {text: "for separate sessions no theorem states it.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L373"}
      adversary:
        value: "any_prover"
        quotes:
          - {text: "against a committer and a prover who may both cheat", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L142"}
          - {text: "so nothing is claimed against a quantum adversary", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L394-L395"}
        note: "classical adversaries only (THEOREM.md L394-L395); the files-fixed-before-the-hash condition is counted under the conditions clause"
        plain: "The publisher states the limit \"against a committer and a prover who may both cheat\" (the committer publishes the commitment; the prover makes the proofs). Our rule asks for any cheating prover: one that runs its own machine as it likes, with a limit that does not rely on trusted hardware or an honest outside party. We read the publisher's words as that. The publisher adds that nothing is claimed against a quantum computer; our rule does not ask about one."
      parameters:
        value: "row"
        quotes:
          - {text: "**One proof format and model size:** full size, not the small examples", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L62"}
          - {text: "Neither figure, 124 bits per query or 128 bits per round, is claimed for the C++ programs.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L70"}
        note: "the row runs the full-size format at exact match; whether its own files are in scope is the conditions clause; the bound is stated for the Lean verifier and not claimed for cp_verify, which the row runs (the program clause)"
        plain: "It states the limit for \"full size, not the small examples\", and we run the full size."
      conditions_shown:
        value: false
        plain: "The condition, in the publisher's words: \"public files that are fixed before the hash function is sampled (a provider that tunes them to the real hash function is outside the statement)\". In plain words: the theorem treats the hash function as drawn at random, and it covers only public files chosen before that draw; it says nothing about files a provider tuned to the actual hash function. No file of ours shows when the files we run were fixed, and the publisher writes that the reader must grant it. The publisher also writes that at files other than its stored examples, the theorem may hold only because the verifier rejects every proof. A verifier that rejects every proof never accepts a fake, so there the theorem could hold and still say nothing about fake replies."
        quotes:
          - {text: "At all other files in scope nothing is known, so there the theorem may hold only because `verify` rejects everything.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L314-L315"}
          - {text: "The proofs from the runs on real weights were checked by `cp_verify` alone; none has been put to the Lean verifier", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L227-L228"}
          - {text: "public files that are fixed before the hash function is sampled (a provider that tunes them to the real hash function is outside the statement)", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L149-L150"}
          - {text: "No file shows that they were fixed before the provider could tune them to the hash function: that you grant.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L288-L289"}
      program:
        value: "not_stated"
        quotes:
          - {text: "Neither figure, 124 bits per query or 128 bits per round, is claimed for the C++ programs.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L70"}
          - {text: "The C++ verifier and the CUDA prover are written to follow the same protocol and are tested against it, not themselves proved.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L7-L8"}
          - {text: "The C++ programs' printed \"bits\" are their own accounting, not a theorem", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/known-limits.md#L65-L66"}
  machine_checked:
    sources_read: ["README.md", "guide/what-is-proved.md", "guide/weight-hiding.md", "lean/THEOREM.md"]
    formal:
      reach:
        value: "protocol_and_statement"
        quotes:
          - {text: "**Soundness** is proved, in Lean, for the verifier written in Lean", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L3"}
          - {text: "At each position it is the greedy next token after the prompt and the output's own earlier tokens, as an integer program computes it, not the floating-point model.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L231-L233"}
          - {text: "That this interactive oracle proof is the protocol of the C++ programs is not proved", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L267-L268"}
          - {text: "Scale files in scope can switch off any of the model's blocks, up to all of them (worked out by hand, not proved).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L229-L231"}
          - {text: "No theorem describes the five constant look-up tables in the Lean text (cosine, sine, the exponential, SiLU and the sigmoid).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L242-L243"}
          - {text: "the kernel checks proofs, not what a definition means", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L83"}
        note: "the theorem covers the Lean protocol and states the model as an integer program (THEOREM.md L231-233); the C++ verifier the row runs is tested, not proved (what-is-proved.md L7-8), so the reach stops short of the verifier code this row runs; the model statement is the publisher's Lean integer model, and its tables and its reach at a given scale file are not proved (THEOREM.md L229-L231, L242-L243)"
        plain: "The theorem covers the whole method, the model's computation included."
      tool:
        value: "Lean 4, kernel 4.29.1"
        quotes:
          - {text: "The protocol's soundness is proved in Lean 4.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L26"}
          - {text: "the pinned version, 4.29.1, is older than fixes of publicly known soundness bugs in it", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L382-L383"}
      toolchain:
        value: {name: "leanprover/lean4", version: "v4.29.1"}
        quotes: [{text: "leanprover/lean4:v4.29.1", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/lean-toolchain#L1"}]
      conclusion:
        value: "model"
        quotes:
          - {text: "At each position it is the greedy next token after the prompt and the output's own earlier tokens, as an integer program computes it, not the floating-point model.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L231-L233"}
          - {text: "\"The model\" means the extracted weights, which no theorem says are the ones `cp_commit` put in", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L227-L228"}
          - {text: "the system in the statement of the soundness theorem on `verify` has a constant committer (a committer that returns one constant whatever the weights, and so commits to nothing; the committer of the six lines is another: the one that `compile` makes (`lean/Johnson/Face/Compiler.lean`), which encodes the weights and hashes the key) where its honest committer goes, so of that system itself none of it can be stated with any content", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L700-L704"}
        note: "read 2026-11-15: the conclusion is about the publisher's integer model, a reference definition of the model's computation, at the weights the extractor reads; no theorem ties those weights to the ones cp_commit committed (THEOREM.md L227-L228), and at files other than the stored examples the theorem may hold only because verify rejects everything (L314-L315, under Integrity's conditions clause); and the system in the soundness theorem's statement has a constant committer, which commits to nothing, so of that system none of it can be stated with any content (L700-L704). So the conclusion is about a reference definition of the model, as a step above Partly met needs, and it is not tied to the weights this row commits"
        plain: "Its conclusion is about the model: about the publisher's integer model (a written-out definition, in Lean, of what the model computes) at the weights read from the files. No theorem ties those weights to the ones cp_commit committed (the first limit below). Our rules accept a conclusion about such a definition as one about the model; they do not ask for a theorem that ties its weights to the committed ones."
      theorem: "VerifierAndGoals.AtTheName.sound_of_verify_at"
      theorem_url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/Johnson/Goal/Skeleton/SoundOfVerifyAt.lean#L69"
      trusted_base:
        value: ["Lean's kernel", "propext", "Classical.choice", "Quot.sound"]
        quotes: [{text: "**Lean's kernel and three standard axioms:** `propext`, `Classical.choice`, `Quot.sound`.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L381"}]
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      input_code_unverified:
        value: true
        quotes: [{text: "Five of the files that this function takes come from a parser outside Lean, of which nothing is proved", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L64-L65"}]
      # the limits the publisher states that no rule reads, each a plain summary and the publisher's words (read
      # 2026-11-17); printed under Formally verified, they set no step
      limits:
        - plain: "The theorem speaks of the weights read from the files. No theorem ties them to the weights cp_commit committed (cp_commit: the publisher's program that publishes the commitment)."
          quotes: [{text: "\"The model\" means the extracted weights, which no theorem says are the ones `cp_commit` put in", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L227-L228"}]
        - plain: "The soundness theorem is stated for a system whose committer (the part that turns the weights into the commitment) is a placeholder: it returns the same constant for any weights, so it commits to nothing. The publisher's six theorems use another committer, the one its compiler makes, which encodes the weights and hashes the key. The publisher writes that of the placeholder system itself, nothing with content can be stated."
          quotes: [{text: "the system in the statement of the soundness theorem on `verify` has a constant committer (a committer that returns one constant whatever the weights, and so commits to nothing; the committer of the six lines is another: the one that `compile` makes (`lean/Johnson/Face/Compiler.lean`), which encodes the weights and hashes the key) where its honest committer goes, so of that system itself none of it can be stated with any content", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L700-L704"}]
        - plain: "Scale files, which the theorem allows as inputs, can switch off any of the model's blocks, up to all of them. The publisher worked this out by hand; it is not proved."
          quotes: [{text: "Scale files in scope can switch off any of the model's blocks, up to all of them (worked out by hand, not proved).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L229-L231"}]
        - plain: "No theorem describes the five fixed look-up tables in the Lean text."
          quotes: [{text: "No theorem describes the five constant look-up tables in the Lean text (cosine, sine, the exponential, SiLU and the sigmoid).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L242-L243"}]
        - plain: "The pinned Lean version, 4.29.1, is older than fixes of publicly known soundness bugs in Lean."
          quotes: [{text: "the pinned version, 4.29.1, is older than fixes of publicly known soundness bugs in it", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L382-L383"}]
        - plain: "Lean checks that a proof is correct, not that a definition means what it is meant to."
          quotes: [{text: "the kernel checks proofs, not what a definition means", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L83"}]
      scope_card:
        soundness:
          protocol: {value: "machine_checked", quotes: [{text: "**Soundness** is proved, in Lean, for the verifier written in Lean", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L3"}]}
          verifier_run: {value: "tested", quotes: [{text: "The C++ verifier and the CUDA prover are written to follow the same protocol and are tested against it, not themselves proved.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L7-L8"}]}
          prover_run: {value: "not_stated", quotes: []}   # soundness is the verifier's: printed "does not apply" (amended 2026-11-15)
          bound:
            value: "q/2^124 + 2^-101"
            quotes: [{text: "a cheating committer and prover with q hash queries between them get the verifier to accept output tokens that are not the model's, at the weights that one extractor reads from the commitment and the committer's hash queries, with probability at most about q/2^124 + 2^-101.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L7-L10"}]
        zero_knowledge:
          protocol: {value: "machine_checked", quotes: [{text: "Zero knowledge, Lean's form of weight hiding, is proved in Lean for the protocol", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]}
          verifier_run: {value: "not_stated", quotes: []}   # zero knowledge is the prover's: printed "does not apply" (amended 2026-11-15)
          bound:
            value: "at or below 2^-154 within 2^64 hash queries and 688,127 replies"
            quotes: [{text: "there is a bound that stays at or below 2^-154 within 2^64 hash queries and 688,127 replies, and zero knowledge holds within this bound on the requests that can be served and whose output tokens are the model's", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L20-L22"}]
          prover_run: {value: "tested", quotes: [{text: "| The C++ and CUDA programs | nothing: not proved; tested |", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L21"}]}
        completeness:
          protocol: {value: "machine_checked", quotes: [{text: "In one line: proved in Lean for the protocol, on served requests, at the exact-match policy", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L149"}]}
          verifier_run: {value: "tested", quotes: [{text: "In the code both are tested, not verified", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L24"}]}
          prover_run: {value: "tested", quotes: [{text: "In the code both are tested, not verified", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L24"}]}
          bound:
            value: "rejected with probability at most 2^-40"
            quotes: [{text: "at every request that can be served (`CanServe`) and whose output tokens are the model's, the honest proof is rejected with probability at most 2^-40.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L15-L17"}]
  weights_hidden:
    sources_read: ["README.md", "guide/weight-hiding.md", "docs/what-is-not-hidden.md"]
    hiding:
      stated:
        value: true
        quotes: [{text: "Zero knowledge, Lean's form of weight hiding, is proved in Lean for the protocol, at [full size](terms.md) and at the exact-match policy, with fresh random masks.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]
      verifier_gets_weights:
        value: false
        quotes: [{text: "Anyone can check the proof on an ordinary CPU in seconds with `cp_verify`, without the weights.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L15-L16"}]
      proof:
        value: "protocol"
        quotes: [{text: "batches, which are what the programs serve, are not covered", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L5"}]
      programs:
        value: "not_stated"
        quotes:
          - {text: "we expect, rather than know, that the programs hide the weights at the default setting, in honest runs, if the provider keeps its duties (this does not reach any real model's weights, or the parameter file and scales fitted to them", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}
          - {text: "Anything else is outside it, and so is any real model, the example's too, because it needs a parameter file fitted to it", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L37"}
        note: "the publisher expects the programs to hide the weights, but says the expectation does not reach a real model's weights or the files fitted to them; the row commits a real model's weights"
        plain: "For its programs (the C++ and CUDA code we run), the publisher states an expectation, not a theorem, and says the expectation does not reach a real model's weights or the files fitted to them. We run a real model, so we count no statement for the programs we run."
      visible_listed:
        value: true
        quotes: [{text: "At least eleven things are visible", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L5"}]
      visible_at_least:
        value: true
        quotes: [{text: "At least eleven things are visible", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L5"}]
      # the form of the proved zero knowledge (read 2026-11-15): printed, sets no step
      zk_kind:
        value: "statistical"
        quotes: [{text: "What Lean proves is statistical, with the hash as a random oracle and for truly random masks", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L25"}]
      zk_model:
        value: "random_oracle"
        quotes: [{text: "For the compiled (non-interactive) prover and the Lean verifier that is proved sound, in the random-oracle model, it holds against any verifier within 2^64 hash queries and 688,127 replies", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]
      zk_unit:
        value: "request"
        quotes: [{text: "They are for one commitment and one request to a proof", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L5"}]
      forms:
        - {item: "For the interactive protocol (IOP) it is honest-verifier zero knowledge.", quotes: [{text: "For the interactive protocol (IOP) it is honest-verifier zero knowledge.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]}
        - {item: "For the compiled (non-interactive) prover and the Lean verifier that is proved sound, in the random-oracle model, it holds against any verifier within 2^64 hash queries and 688,127 replies", quotes: [{text: "For the compiled (non-interactive) prover and the Lean verifier that is proved sound, in the random-oracle model, it holds against any verifier within 2^64 hash queries and 688,127 replies", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]}
        - {item: "up to a statistical distance below 2^-154", quotes: [{text: "all that such a verifier sees can be simulated from the public files, the requests and one bit per request (served or refused: a request is refused if it is ill-formed, if the model has no result on it, or if its result is other tokens), up to a statistical distance below 2^-154", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]}
        - {item: "They are for one commitment and one request to a proof", quotes: [{text: "They are for one commitment and one request to a proof", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L5"}]}
        - {item: "batches, which are what the programs serve, are not covered", quotes: [{text: "batches, which are what the programs serve, are not covered", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L5"}]}
        - {item: "with the programs' seed (ChaCha20) hiding can be computational at best", quotes: [{text: "What Lean proves is statistical, with the hash as a random oracle and for truly random masks; with the programs' seed (ChaCha20) hiding can be computational at best.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L25"}]}
        - {item: "The honest prover in these theorems is a Lean definition, not the CUDA prover.", quotes: [{text: "The honest prover in these theorems is a Lean definition, not the CUDA prover.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]}
      visible:   # item = the heading without markup; quotes = the heading verbatim (+ the sentence that ties it to the weights)
        - {item: "Each reply.", tag: "statement_io", quotes: [{text: "**Each reply.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L53"}]}
        - {item: "Whether a request was served or failed.", tag: "statement_io", quotes: [{text: "**Whether a request was served or failed.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L58"}]}
        - {item: "Time.", tag: "side_channel", quotes: [{text: "**Time.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L64"}]}
        - {item: "The architecture and every size.", tag: "shape", quotes: [{text: "**The architecture and every size.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L72"}]}
        - {item: "Settings fitted to the weights.", tag: "fitted_to_weights", quotes: [{text: "**Settings fitted to the weights.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L74"}, {text: "Two sets of public values are computed from the weights and a calibration set.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L74"}]}
        - {item: "That cp_commit's checks passed.", tag: "fitted_to_weights", quotes: [{text: "**That `cp_commit`'s checks passed.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L80"}, {text: "So it says that every weight outside the embedding lies in its declared range", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L80"}]}
        - {item: "That a batch failed or the service stopped.", tag: "side_channel", quotes: [{text: "**That a batch failed or the service stopped.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L84"}]}
        - {item: "How much a provider has served, and when.", tag: "side_channel", quotes: [{text: "**How much a provider has served, and when.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L92"}]}
        - {item: "Who shared a batch, and how many.", tag: "side_channel", quotes: [{text: "**Who shared a batch, and how many.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L97"}]}
        - {item: "Lengths, places in the batch and nonces.", tag: "side_channel", quotes: [{text: "**Lengths, places in the batch and nonces.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L99"}]}
        - {item: "Masked sums of the weights, public for good.", tag: "fitted_to_weights", quotes: [{text: "**Masked sums of the weights, public for good.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L102"}, {text: "`cp_commit` publishes, for each row of each weight table, a sum of the row's weights with public factors.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L102"}]}
  no_trusted_party:
    sources_read: ["README.md", "guide/what-is-proved.md", "lean/THEOREM.md"]
    trust:
      rests_on:
        value: "transparent"
        quotes:
          - {text: "Six theorems are proved in Lean of one committer, prover and verifier, `compile (flashProve setup)`, at every public setup `setup` (`PublicSetup`: three public files, what the reader returns at them, and `FilesInUse`).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L3-L5"}
          - {text: "`Sound` says that there is one extractor such that, whatever the committer and the prover, `verify` accepts a false claim with probability at most the bound at q = a + b.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L276-L277"}
          - {text: "public files that are fixed before the hash function is sampled (a provider that tunes them to the real hash function is outside the statement)", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L149-L150"}
          - {text: "the soundness theorem on `verify` has no hypothesis beyond those in its statement, so nothing more is assumed by that road.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L413-L414"}
          - {text: "**The random-oracle model** for the hash, with a second, fixed hash function, built on BLAKE2b's compression function, assumed independent of it, against classical adversaries.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L57-L58"}
          - {text: "the random oracle and the second hash function belong to the statement, not to the proof's axioms.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L159-L160"}
        note: "the publisher states soundness at every public setup of three public files, against any committer and prover, with the random-oracle model as its assumption; no sentence says in words that no setup produced a secret, so the petal is read as transparent and graded Mostly met at most (GL-10, amended 2026-11-15)"
        plain: "The publisher proves its theorems at every public setup (three public files it names), against any committer and prover. The assumptions it states are the random-oracle model for the hash function (the hash is treated as a perfectly random function), with a second, fixed hash function, built on BLAKE2b's compression function, assumed independent of it, against classical adversaries (not quantum ones). These are idealizations of hash functions, not proved properties of them. None of them needs a secret or a trusted party, and we count them among cryptographic assumptions; this is our reading. The theorem's condition that the public files are fixed before the hash function is drawn is counted under Integrity."
      publicly_checkable:
        value: true
        quotes: [{text: "Anyone can check the proof on an ordinary CPU in seconds with `cp_verify`, without the weights.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L15-L16"}]
# RFC-0018 SI-3 (amended 2026-11-15): the system page's Statement block, each row the fields of the
# claim card that say it (kept here: an edit to claim.yaml would change the digest the v1.0 runs
# record, RFC-0014 §Eligibility). `cp_verify` checks a token file the adapter writes from the claimed reply, which
# the harness takes from its own record; the Lean verifier is not run or timed by any session.
verifier_inputs:
  program: "cp_verify"
  untimed: ["Lean verifier"]
  reply: "record"
  commit_record: ["assumptions.0", "binding.statement"]
  request: ["residual.2"]
  proof: ["residual.5"]
  decoding: ["coverage.policy.detail"]
  unchecked: ["assumptions.1"]
  architecture: ["zero_knowledge.not_hidden"]
  architecture_visible: "the architecture and every size"
